<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#c8102e" />
    <title>Support Chat — US Pizza</title>
    <link rel="stylesheet" href="/styles/app.css" />
  </head>
  <body class="webview-embed">
    <div class="app-shell">
      <header class="app-header">
        <a class="app-header-back" href="/" aria-label="Back to menu">←</a>
        <h1 id="bot-title" class="app-header-title">Support Chat</h1>
      </header>

      <div id="bot-error" class="error-banner hidden" role="alert"></div>
      <div id="bot-loading" class="loading-state">Starting chat…</div>

      <div class="chat-page-body hidden" id="bot-chat-panel">
        <div id="bot-messages" class="chat-thread" aria-live="polite"></div>
        <form id="bot-compose" class="chat-compose">
          <input
            id="bot-input"
            type="text"
            placeholder="Type your message…"
            autocomplete="off"
            maxlength="2000"
          />
          <button id="bot-send-btn" type="submit">Send</button>
        </form>
      </div>
    </div>

    <script type="module" src="/src/pages/botChatPage.js"></script>
  </body>
</html>
