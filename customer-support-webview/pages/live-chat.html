<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#c8102e" />
    <title>Live Support — US Pizza</title>
    <link rel="stylesheet" href="/styles/app.css" />
  </head>
  <body class="webview-embed">
    <div class="app-shell">
      <header class="app-header">
        <a class="app-header-back" href="/" aria-label="Back to menu">←</a>
        <h1 class="app-header-title">Talk to Support</h1>
        <span id="live-status" class="chat-status is-connecting">Connecting</span>
      </header>

      <div id="live-error" class="error-banner hidden" role="alert"></div>
      <div id="live-loading" class="loading-state">Connecting to support…</div>

      <div class="chat-page-body hidden" id="live-chat-panel">
        <div id="live-messages" class="chat-thread" aria-live="polite"></div>
        <form id="live-compose" class="chat-compose">
          <input
            id="live-input"
            type="text"
            placeholder="Type your message…"
            autocomplete="off"
            maxlength="2000"
          />
          <button id="live-send-btn" type="submit">Send</button>
        </form>
      </div>
    </div>

    <script type="module" src="/src/pages/liveChatPage.js"></script>
  </body>
</html>
