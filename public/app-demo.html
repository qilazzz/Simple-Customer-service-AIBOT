<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content"
    />
    <title>US Pizza App — Support Demo</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: #f4f4f5;
        color: #18181b;
      }
      .app-shell {
        max-width: 420px;
        margin: 0 auto;
        min-height: 100vh;
        min-height: 100dvh;
        background: #fff;
        box-shadow: 0 0 40px rgba(0,0,0,0.08);
      }
      .app-header {
        background: linear-gradient(135deg, #c8102e, #9b0c23);
        color: #fff;
        padding: 2rem 1.5rem 1.5rem;
      }
      .app-header h1 { margin: 0 0 0.25rem; font-size: 1.5rem; }
      .app-header p { margin: 0; opacity: 0.9; font-size: 0.9rem; }
      .app-body { padding: 1.5rem; }
      .menu-card {
        background: #fafafa;
        border: 1px solid #e4e4e7;
        border-radius: 14px;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      .menu-card h3 { margin: 0 0 0.5rem; }
      .menu-card p { margin: 0; color: #71717a; font-size: 0.9rem; }
      .hint {
        font-size: 0.85rem;
        color: #71717a;
        text-align: center;
        margin-top: 2rem;
        padding: 0 1rem;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <h1>🍕 US Pizza</h1>
        <p>Order · Track · Support</p>
      </header>
      <main class="app-body">
        <div class="menu-card">
          <h3>Meat Lovers Pizza</h3>
          <p>RM 28.90 · 30–45 min delivery</p>
        </div>
        <div class="menu-card">
          <h3>Super Supreme</h3>
          <p>RM 32.90 · Best seller</p>
        </div>
        <p class="hint">
          Drag the headset button anywhere, then release — it snaps to the nearest left or right edge.
          Tap to open Customer Support.
        </p>
      </main>
    </div>

    <script src="/sdk/customer-support-client.js"></script>
    <script src="/sdk/embed-widget.js"></script>
    <script>
      UsPizzaSupportWidget.init({
        baseUrl: window.location.origin,
        measureHeader: true,
      });
    </script>
  </body>
</html>
