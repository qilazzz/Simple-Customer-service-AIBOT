<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — US Pizza Customer Service</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/auth.css" />
    <link rel="icon" href="/assets/images/us-pizza-logo.png" type="image/png" />
  </head>
  <body>
    <main class="page auth-page">
      <div class="container auth-container">
        <nav class="site-nav" aria-label="Main navigation">
          <a href="/">Home</a>
          <a href="/chat.html">AI Chatbot</a>
          <a href="/login.html">Login</a>
        </nav>

        <div class="auth-card card">
          <div class="auth-brand">
            <img src="/assets/images/us-pizza-logo.png" alt="US Pizza" width="72" height="72" />
          </div>
          <span class="badge">Customer Account</span>
          <h1>Create your account</h1>
          <p class="auth-sub">Register once — we'll remember you for chat support and complaints.</p>

          <div id="register-error" class="error-banner hidden" role="alert"></div>

          <form id="register-form" class="auth-form" novalidate>
            <div>
              <label for="name">Full Name</label>
              <input id="name" name="name" type="text" required autocomplete="name" placeholder="Your name" maxlength="150" />
            </div>
            <div>
              <label for="email">Email</label>
              <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com" maxlength="150" />
            </div>
            <div>
              <label for="phone_number">Phone <span class="optional">(optional)</span></label>
              <input id="phone_number" name="phone_number" type="tel" autocomplete="tel" placeholder="e.g. 013 667 9056" maxlength="50" />
            </div>
            <div>
              <label for="password">Password</label>
              <input id="password" name="password" type="password" required autocomplete="new-password" placeholder="At least 6 characters" minlength="6" />
            </div>
            <div>
              <label for="confirm_password">Confirm Password</label>
              <input id="confirm_password" name="confirm_password" type="password" required autocomplete="new-password" placeholder="Repeat password" minlength="6" />
            </div>
            <button type="submit" class="btn-primary auth-submit">Create account</button>
          </form>

          <p class="auth-switch">
            Already have an account? <a href="/login.html">Log in</a>
          </p>
        </div>
      </div>
    </main>

    <script src="/js/customer-auth.js"></script>
    <script src="/js/register.js"></script>
  </body>
</html>
