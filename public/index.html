<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>US Pizza Customer Service</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: linear-gradient(145deg, #e53935 0%, #c62828 45%, #b71c1c 100%);
        color: #18181b;
      }
      .card {
        width: min(420px, 100%);
        background: #fff;
        border-radius: 20px;
        padding: 2rem 1.75rem;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
        text-align: center;
      }
      .logo {
        font-size: 2rem;
        margin-bottom: 0.35rem;
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.35rem;
        color: #c8102e;
      }
      p {
        margin: 0 0 1.5rem;
        color: #71717a;
        font-size: 0.92rem;
        line-height: 1.5;
      }
      .actions {
        display: grid;
        gap: 0.75rem;
      }
      a {
        display: block;
        text-decoration: none;
        border-radius: 14px;
        padding: 1rem 1.15rem;
        font-weight: 700;
        font-size: 0.95rem;
      }
      .btn-user {
        background: #c8102e;
        color: #fff;
      }
      .btn-admin {
        background: #fff;
        color: #c8102e;
        border: 2px solid #c8102e;
      }
      .hint {
        margin-top: 1.25rem;
        font-size: 0.78rem;
        color: #a1a1aa;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">🍕</div>
      <h1>US Pizza Customer Service</h1>
      <p>Choose where you want to go — customer app or admin dashboard.</p>
      <nav class="actions" aria-label="Portal links">
        <a class="btn-user" href="/portal/">Customer Portal</a>
        <a class="btn-admin" href="/admin/login.html">Admin Dashboard</a>
      </nav>
      <p class="hint">API health: <a href="/health">/health</a></p>
    </main>
  </body>
</html>
