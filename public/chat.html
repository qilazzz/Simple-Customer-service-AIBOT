<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content"
    />
    <title>US Pizza — Live Support</title>
    <link rel="stylesheet" href="/css/chat.css" />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body>
    <div class="chat-page">
      <header class="chat-header">
        <div class="chat-header-main">
          <h1>US Pizza Support</h1>
          <span id="support-status" class="support-status is-connecting">Connecting...</span>
        </div>
        <p>Direct live support with our customer care team</p>
      </header>

      <div id="chat-user-bar" class="chat-user-bar hidden">
        <span>Signed in as <strong id="chat-user-name">Customer</strong></span>
        <div class="chat-user-actions">
          <button id="chat-logout-btn" type="button">Log out</button>
        </div>
      </div>
      <div id="chat-guest-bar" class="chat-user-bar">
        <span>Chat as guest or sign in for continuous history</span>
        <div class="chat-user-actions">
          <a href="/login.html?redirect=/chat.html">Log in</a>
          <a href="/register.html?redirect=/chat.html">Register</a>
        </div>
      </div>

      <div class="chat-widget">
        <div class="chat-toolbar">
          <div class="chat-avatar">💬</div>
          <div>
            <strong>US Pizza Support</strong>
            <small id="toolbar-status">Live support queue</small>
          </div>
        </div>

        <div id="chat-messages" class="chat-messages"></div>
        <div id="typing" class="typing hidden">Sending...</div>
        <div class="chat-compose chat-input-container">
          <textarea id="chat-input" placeholder="Type your message..." rows="2"></textarea>
          <div class="compose-actions">
            <button id="send-btn" class="btn btn-primary" type="button">Send</button>
          </div>
        </div>
      </div>

      <p class="chat-links">
        <a href="/">Home</a> ·
        <a href="/login.html">Login</a> ·
        <a href="/register.html">Register</a> ·
        <a href="/admin/login.html">Admin login</a>
      </p>
    </div>

    <script src="/js/customer-auth.js"></script>
    <script src="/js/chat-keyboard-fix.js"></script>
    <script src="/js/chat-widget.js"></script>
  </body>
</html>
